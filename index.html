<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suivi Bacs & Matériel — Cuisine Centrale</title>
<style>
:root {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface-2: #eef0f3;
  --text: #1a1d23;
  --text-dim: #6b7280;
  --border: #e2e4e9;
  --primary: #2563eb;
  --primary-dim: #dbe6fe;
  --ok: #16a34a;
  --ok-bg: #e7f7ec;
  --warn: #d97706;
  --warn-bg: #fdf3e3;
  --danger: #dc2626;
  --danger-bg: #fbe9e9;
  --radius: 14px;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161a;
    --surface: #1d2026;
    --surface-2: #262a32;
    --text: #eef0f3;
    --text-dim: #9aa1ad;
    --border: #33373f;
    --primary: #5b8cf7;
    --primary-dim: #1f2c4d;
    --ok: #4ade80;
    --ok-bg: #133421;
    --warn: #fbbf24;
    --warn-bg: #3a2c0d;
    --danger: #f87171;
    --danger-bg: #3b1616;
  }
}
:root[data-theme="dark"] {
  --bg: #14161a;
  --surface: #1d2026;
  --surface-2: #262a32;
  --text: #eef0f3;
  --text-dim: #9aa1ad;
  --border: #33373f;
  --primary: #5b8cf7;
  --primary-dim: #1f2c4d;
  --ok: #4ade80;
  --ok-bg: #133421;
  --warn: #fbbf24;
  --warn-bg: #3a2c0d;
  --danger: #f87171;
  --danger-bg: #3b1616;
}
* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  min-height: 100%;
}
header.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 16px calc(14px + env(safe-area-inset-top, 0px)) 16px;
  padding-top: calc(14px + env(safe-area-inset-top, 0px));
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
header.topbar h1 {
  font-size: 16px;
  margin: 0;
  font-weight: 700;
  line-height: 1.2;
}
header.topbar .sub { font-size: 12px; color: var(--text-dim); }
.tabs {
  display: flex;
  gap: 6px;
  background: var(--surface-2);
  border-radius: 999px;
  padding: 4px;
}
.tabs button {
  border: none;
  background: transparent;
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-dim);
  cursor: pointer;
}
.tabs button.active { background: var(--primary); color: white; }
main { max-width: 760px; margin: 0 auto; padding: 16px; padding-bottom: 60px; }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 14px;
}
.card h2 { font-size: 15px; margin: 0 0 12px 0; }
label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 5px; font-weight: 600; }
select, input[type="text"], input[type="number"], input[type="date"] {
  width: 100%;
  padding: 11px 12px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text);
  font-size: 15px;
  margin-bottom: 12px;
}
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 12px 16px;
  border-radius: 10px;
  border: none;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  width: 100%;
}
.btn-primary { background: var(--primary); color: white; }
.btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
.btn-ok { background: var(--ok); color: white; }
.btn-sm { width: auto; padding: 8px 12px; font-size: 12px; }
.toggle2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.toggle2 button {
  padding: 14px;
  border-radius: 10px;
  border: 2px solid var(--border);
  background: var(--surface-2);
  color: var(--text);
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
}
.toggle2 button.on-livraison.active { border-color: var(--primary); background: var(--primary-dim); color: var(--primary); }
.toggle2 button.on-recup.active { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); }
.qty-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.qty-grid .item label { font-size: 12px; }
.pill { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; }
.pill-ok { background: var(--ok-bg); color: var(--ok); }
.pill-warn { background: var(--warn-bg); color: var(--warn); }
.pill-muted { background: var(--surface-2); color: var(--text-dim); }
.stat-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; }
.stat { background: var(--surface-2); border-radius: 12px; padding: 12px; }
.stat .n { font-size: 22px; font-weight: 800; }
.stat .l { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
th { color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: .03em; }
.table-wrap { overflow-x: auto; }
.school-row { cursor: pointer; }
.school-row:active { background: var(--surface-2); }
.muted { color: var(--text-dim); font-size: 12px; }
.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.filters select, .filters input { margin-bottom: 0; }
.toast {
  position: fixed;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  left: 50%;
  transform: translateX(-50%);
  background: var(--ok);
  color: white;
  padding: 12px 20px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 13px;
  box-shadow: 0 6px 20px rgba(0,0,0,.2);
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s ease;
}
.toast.show { opacity: 1; }
.back-link { font-size: 13px; color: var(--primary); background: none; border: none; padding: 4px 0 10px 0; cursor: pointer; font-weight: 700; }
.new-item-hint { font-size: 12px; color: var(--text-dim); margin: -6px 0 12px 0; }
.subtabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.subtabs button { border: 1px solid var(--border); background: var(--surface); color: var(--text-dim); padding: 7px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; cursor: pointer; }
.subtabs button.active { background: var(--text); color: var(--bg); border-color: var(--text); }
.empty { text-align: center; padding: 30px 10px; color: var(--text-dim); font-size: 13px; }
.loading { text-align: center; padding: 40px 10px; color: var(--text-dim); font-size: 13px; }
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  padding: 20px;
  padding-top: calc(20px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
}
.modal-box {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 20px;
  max-width: 360px;
  width: 100%;
  box-shadow: 0 10px 40px rgba(0,0,0,.3);
}
.modal-box p { font-size: 14px; margin: 0 0 16px 0; line-height: 1.4; }
</style>
</head>

<div id="app"><div class="loading">Chargement…</div></div>
<div id="toast" class="toast"></div>

<!-- Firebase (SDK compat, pas de build nécessaire) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
// ⚠️ À REMPLIR : colle ici la config de TON projet Firebase
// (Console Firebase → ⚙️ Paramètres du projet → Tes applications → SDK setup and configuration)
const firebaseConfig = {
  apiKey: "AIzaSyDuhglPxfaALV7Is8OuJI1w3vjBL2NooYE",
  authDomain: "bacs-inox-saint-denis.firebaseapp.com",
  projectId: "bacs-inox-saint-denis",
  storageBucket: "bacs-inox-saint-denis.firebasestorage.app",
  messagingSenderId: "426456295316",
  appId: "1:426456295316:web:a76d72674a1fe4f5989181"
};
</script>
<script>
const MATERIELS = [
  { key: "socles", label: "Socles" },
  { key: "paniers", label: "Paniers" },
  { key: "caisses", label: "Caisses" },
  { key: "inox12", label: "Bacs inox 1/2" },
  { key: "inox13", label: "Bacs inox 1/3" },
];
const MAT_KEYS = MATERIELS.map(m => m.key);

const SEED_SCHOOLS = [
["08","Denis Diderot","A- Plaine scolaire 1"],["10","Mater Pleyel Bis","A- Plaine scolaire 1"],
["10b","Elem Pleyel","A- Plaine scolaire 1"],["18","Le Lendit","A- Plaine scolaire 1"],
["29","Gutenberg","A- Plaine scolaire 1"],["31","Aimé Césaire","A- Plaine scolaire 1"],
["32","Casarès Doisneau","A- Plaine scolaire 1"],["33","Opaline Lacore","A- Plaine scolaire 1"],
["36","Petits Cailloux","A- Plaine scolaire 1"],["37","Le Cordouan","A- Plaine scolaire 1"],
["38","Lili Boulanger","A- Plaine scolaire 1"],
["09","André Diez","B- Centre scolaire 2"],["09bis","Madigou","B- Centre scolaire 2"],
["11","Les Gueldres","B- Centre scolaire 2"],["14","Paul Langevin","B- Centre scolaire 2"],
["17","Puy Pensot","B- Centre scolaire 2"],["23","Marcel Sembat","B- Centre scolaire 2"],
["24","Daniel Sorano","B- Centre scolaire 2"],["25","La Source","B- Centre scolaire 2"],
["27","Jean Vilar","B- Centre scolaire 2"],["30","Colette Besson","B- Centre scolaire 2"],
["34","Roseraie de Chambrun","B- Centre scolaire 2"],
["01","Marville","C- Est scolaire 3"],["04","Cosmonautes","C- Est scolaire 3"],
["05","Joliot Curie","C- Est scolaire 3"],["07","René Descartes","C- Est scolaire 3"],
["15","Danielle Casanova","C- Est scolaire 3"],["16","Louis Pasteur","C- Est scolaire 3"],
["19","Francs Moisin","C- Est scolaire 3"],["20","La Saussaie","C- Est scolaire 3"],
["26","Vieille Mer","C- Est scolaire 3"],
["02","Jules Guesdes","D- Ouest scolaire 4"],["03","Corbillon","D- Ouest scolaire 4"],
["06","Delaunay-Belleville","D- Ouest scolaire 4"],["12","Jules Vallès","D- Ouest scolaire 4"],
["13","Victor Hugo","D- Ouest scolaire 4"],["21","Pierre Semard","D- Ouest scolaire 4"],
["22","Roger Semat","D- Ouest scolaire 4"],["28","Brise Échalas","D- Ouest scolaire 4"],
["35","Confluence","D- Ouest scolaire 4"],
["","Meriel",""],
["","Duclos",""],
["","Excédents Excellents",""],
["","Réfectoire",""],
];

let db = null;
let state = {
  view: "chauffeur",
  respTab: "dashboard",
  drivers: [],
  schools: [],
  movements: [],
  ready: false,
  driverId: "",
  schoolId: "",
  type: "livraison",
  qty: { socles: "", paniers: "", caisses: "", inox12: "", inox13: "" },
  detailSchoolId: null,
  filters: { driverId: "", schoolId: "", type: "" },
  addingDriver: false,
  newDriverName: "",
  addingSchool: false,
  newSchool: { name: "", chauffeur: "", adresse: "" },
  editingMovementId: null,
  editMovement: null,
  editingSchoolId: null,
  editSchool: null,
  editingDriverId: null,
  editDriverName: "",
  confirmAction: null,
};

function today() {
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function fmtDate(iso) {
  if (!iso) return "";
  const [y,m,d] = iso.split("-");
  return `${d}/${m}/${y.slice(2)}`;
}
function showToast(msg, ms) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove("show"), ms || 1800);
}

function askConfirm(message, onConfirmFn) {
  state.confirmAction = { message, onConfirmFn };
  render();
}

async function initDb() {
  try {
    if (String(firebaseConfig.apiKey).includes("REMPLACE_MOI")) {
      document.getElementById("app").innerHTML = `<div style="padding:40px 20px;text-align:center;color:var(--text-dim);font-size:14px;">
        Configuration Firebase manquante.<br>Renseigne <code>firebaseConfig</code> en haut du fichier HTML (clé du projet Firebase), puis recharge la page.
      </div>`;
      return;
    }
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  } catch (e) {
    document.getElementById("app").innerHTML = `<div style="padding:40px 20px;text-align:center;color:var(--text-dim);font-size:14px;">
      Impossible de se connecter à Firebase. Vérifie la configuration (firebaseConfig) et ta connexion internet.<br><span class="muted">${escapeHtml(e.message||"")}</span>
    </div>`;
    return;
  }
  await seedSchoolsIfNeeded();
  subscribeSchools();
  subscribeDrivers();
  subscribeMovements();
  setTimeout(() => {
    if (!state.ready && !dbError) {
      dbError = "Aucune réponse de Firestore après 10 secondes. Vérifie ta connexion internet et que les règles Firestore ont bien été publiées.";
      render();
    }
  }, 10000);
}

async function seedSchoolsIfNeeded() {
  let existingNames = new Set();
  try {
    const snap = await db.collection("schools").get();
    existingNames = new Set(snap.docs.map(d => (d.data().name||"").trim().toLowerCase()));
  } catch (e) { return; }
  for (const [code, name] of SEED_SCHOOLS) {
    if (existingNames.has(name.trim().toLowerCase())) continue;
    try {
      await db.collection("schools").add({ code, name, chauffeur: "", adresse: "", note: "", active: true });
    } catch (e) { /* ignore individual failures */ }
  }
}

let dbError = null;

function subscribeSchools() {
  db.collection("schools").onSnapshot(
    (snap) => {
      state.schools = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b)=>(a.name||"").localeCompare(b.name||""));
      state.ready = true;
      render();
    },
    (e) => { dbError = "schools: " + (e && (e.code || e.message) || "erreur inconnue"); console.error("subscribeSchools error", e); render(); }
  );
}

function subscribeDrivers() {
  db.collection("drivers").onSnapshot(
    (snap) => {
      state.drivers = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b)=>(a.name||"").localeCompare(b.name||""));
      render();
    },
    (e) => { dbError = "drivers: " + (e && (e.code || e.message) || "erreur inconnue"); console.error("subscribeDrivers error", e); render(); }
  );
}

function subscribeMovements() {
  db.collection("movements").onSnapshot(
    (snap) => {
      state.movements = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
      render();
    },
    (e) => { dbError = "movements: " + (e && (e.code || e.message) || "erreur inconnue"); console.error("subscribeMovements error", e); render(); }
  );
}

// ---------- Business logic ----------

function emptyMatObj() {
  const o = {};
  for (const k of MAT_KEYS) o[k] = 0;
  return o;
}
function balancesForSchool(schoolId) {
  const bal = emptyMatObj();
  const livre = emptyMatObj();
  const recup = emptyMatObj();
  for (const m of state.movements) {
    if (m.schoolId !== schoolId) continue;
    const sign = m.type === "livraison" ? 1 : -1;
    for (const k of MAT_KEYS) {
      const v = Number(m[k]) || 0;
      bal[k] += sign * v;
      if (m.type === "livraison") livre[k] += v; else recup[k] += v;
    }
  }
  return { bal, livre, recup };
}

function globalStats() {
  const d = today();
  let livToday = 0, recToday = 0;
  const ecartsSchools = new Set();
  for (const s of state.schools) {
    const { bal } = balancesForSchool(s.id);
    if (MAT_KEYS.some(k => bal[k] !== 0)) ecartsSchools.add(s.id);
  }
  for (const m of state.movements) {
    if (m.date === d) {
      if (m.type === "livraison") livToday++; else recToday++;
    }
  }
  return {
    nbChauffeurs: state.drivers.length,
    nbEcoles: state.schools.length,
    livToday, recToday,
    nbEcarts: ecartsSchools.size,
  };
}

function driverStats(driverId) {
  const schoolsSet = new Set();
  let liv = 0, rec = 0;
  const restant = emptyMatObj();
  for (const m of state.movements) {
    if (m.driverId !== driverId) continue;
    schoolsSet.add(m.schoolId);
    if (m.type === "livraison") liv++; else rec++;
  }
  // restant à récupérer = solde des écoles habituellement gérées par ce chauffeur (approx via mouvements)
  for (const sid of schoolsSet) {
    const { bal } = balancesForSchool(sid);
    for (const k of MAT_KEYS) restant[k] += Math.max(0, bal[k]);
  }
  return { nbEcoles: schoolsSet.size, liv, rec, restant };
}

// ---------- Actions ----------

async function addDriver(name) {
  name = (name || "").trim();
  if (!name) return;
  const existing = state.drivers.find(d => d.name.toLowerCase() === name.toLowerCase());
  if (existing) { state.driverId = existing.id; state.addingDriver = false; render(); return; }
  try {
    const ref = await db.collection("drivers").add({ name });
    state.driverId = ref.id;
    state.addingDriver = false;
    render();
  } catch (e) {
    console.error("addDriver failed", e);
    showToast("Erreur : " + (e && e.code ? e.code : (e && e.message) || "inconnue"), 4500);
  }
}

async function addSchool() {
  const { name, chauffeur, adresse } = state.newSchool;
  if (!name.trim()) { showToast("Nom de l'école requis"); return; }
  try {
    await db.collection("schools").add({
      code: "", name: name.trim(), chauffeur: chauffeur.trim(), adresse: adresse.trim(), note: "", active: true
    });
    state.newSchool = { name: "", chauffeur: "", adresse: "" };
    state.addingSchool = false;
    showToast("École ajoutée");
    render();
  } catch (e) {
    console.error("addSchool failed", e);
    showToast("Erreur : " + (e && e.code ? e.code : (e && e.message) || "inconnue"), 4500);
  }
}

async function submitMovement() {
  if (!state.driverId) { showToast("Choisis un chauffeur"); return; }
  if (!state.schoolId) { showToast("Choisis une école"); return; }
  const driver = state.drivers.find(d => d.id === state.driverId);
  const school = state.schools.find(s => s.id === state.schoolId);
  const q = state.qty;
  const anyQty = MAT_KEYS.some(k => Number(q[k]) > 0);
  if (!anyQty) { showToast("Renseigne au moins une quantité"); return; }
  const data = {
    date: today(),
    timestamp: Date.now(),
    driverId: state.driverId,
    driverName: driver ? driver.name : "",
    schoolId: state.schoolId,
    schoolName: school ? school.name : "",
    type: state.type,
  };
  for (const k of MAT_KEYS) data[k] = Number(q[k]) || 0;
  try {
    await db.collection("movements").add(data);
    state.qty = { socles: "", paniers: "", caisses: "", inox12: "", inox13: "" };
    showToast(state.type === "livraison" ? "Livraison enregistrée ✓" : "Récupération enregistrée ✓");
    render();
  } catch (e) {
    console.error("submitMovement failed", e);
    showToast("Échec de l'enregistrement : " + (e && e.code ? e.code : (e && e.message) || "erreur inconnue"), 4500);
  }
}

// ---------- Édition / suppression (responsable) ----------

function startEditMovement(id) {
  const m = state.movements.find(x => x.id === id);
  if (!m) return;
  state.editingMovementId = id;
  state.editMovement = {
    date: m.date, driverId: m.driverId, schoolId: m.schoolId, type: m.type,
    socles: m.socles||0, paniers: m.paniers||0, caisses: m.caisses||0, inox12: m.inox12||0, inox13: m.inox13||0,
  };
  render();
}
function cancelEditMovement() { state.editingMovementId = null; state.editMovement = null; render(); }

async function saveEditMovement() {
  const id = state.editingMovementId;
  const em = state.editMovement;
  if (!id || !em) return;
  const driver = state.drivers.find(d => d.id === em.driverId);
  const school = state.schools.find(s => s.id === em.schoolId);
  const data = {
    date: em.date, driverId: em.driverId, driverName: driver ? driver.name : "",
    schoolId: em.schoolId, schoolName: school ? school.name : "", type: em.type,
  };
  for (const k of MAT_KEYS) data[k] = Number(em[k]) || 0;
  try {
    await db.collection("movements").doc(id).update(data);
    state.editingMovementId = null; state.editMovement = null;
    showToast("Mouvement modifié ✓");
    render();
  } catch (e) {
    console.error("saveEditMovement failed", e);
    showToast("Échec de la modification : " + (e && e.code ? e.code : (e && e.message) || "erreur inconnue"), 4500);
  }
}

async function deleteMovement(id) {
  try {
    await db.collection("movements").doc(id).delete();

// ---------- Export Excel ----------

function exportExcel() {
  try {
    const f = state.filters;
    let list = [...state.movements];
    if (f.driverId) list = list.filter(m => m.driverId === f.driverId);
    if (f.schoolId) list = list.filter(m => m.schoolId === f.schoolId);
    if (f.type) list = list.filter(m => m.type === f.type);
    list.sort((a,b) => b.timestamp - a.timestamp);

    const movementRows = list.map(m => {
      const row = {
        "Date": fmtDate(m.date),
        "Chauffeur": m.driverName || "",
        "École": m.schoolName || "",
        "Opération": m.type === "livraison" ? "Livraison" : "Récupération",
      };
      MATERIELS.forEach(mt => { row[mt.label] = m[mt.key] || 0; });
      return row;
    });

    const ecartRows = [...state.schools].sort((a,b)=>a.name.localeCompare(b.name)).map(s => {
      const { bal, livre, recup } = balancesForSchool(s.id);
      const row = { "École": s.name, "Chauffeur habituel": s.chauffeur || "" };
      MATERIELS.forEach(mt => {
        row[mt.label + " — Livré"] = livre[mt.key];
        row[mt.label + " — Récupéré"] = recup[mt.key];
        row[mt.label + " — Solde"] = bal[mt.key];
      });
      return row;
    });

    const wb = XLSX.utils.book_new();
    const wsMov = XLSX.utils.json_to_sheet(movementRows);
    XLSX.utils.book_append_sheet(wb, wsMov, "Mouvements");
    const wsEcarts = XLSX.utils.json_to_sheet(ecartRows);
    XLSX.utils.book_append_sheet(wb, wsEcarts, "Écarts par école");
    XLSX.writeFile(wb, `bacs-inox-export-${today()}.xlsx`);
    showToast("Export téléchargé ✓");
  } catch (e) {
    console.error("exportExcel failed", e);
    showToast("Échec de l'export : " + (e && e.message ? e.message : "erreur inconnue"), 4500);
  }
}

        <select id="filterType" style="grid-column:1/-1;">
          <option value="">Livraison + Récupération</option>
          <option value="livraison" ${f.type==='livraison'?'selected':''}>Livraison seulement</option>
          <option value="recuperation" ${f.type==='recuperation'?'selected':''}>Récupération seulement</option>
        </select>
      </div>
      <button class="btn btn-primary btn-sm" id="exportExcelBtn" style="margin-top:10px;width:100%;">📊 Exporter en Excel (mouvements filtrés + écarts par école)</button>
    </div>
    <div class="card">
      <h2>${list.length} mouvement(s)</h2>
      <div class="table-wrap">
      <table>
        <thead><tr><th>Date</th><th>Chauffeur</th><th>École</th><th>Op.</th><th>Soc.</th><th>Pan.</th><th>Caiss.</th><th>1/2</th><th>1/3</th><th></th></tr></thead>
        <tbody>
          ${list.map(m => {
            if (state.editingMovementId === m.id) return editRowHtml(m);
            return `
            <tr>
              <td>${fmtDate(m.date)}</td>
              <td>${escapeHtml(m.driverName)}</td>
              <td>${escapeHtml(m.schoolName)}</td>
              <td>${m.type==='livraison'?'Livr.':'Récup.'}</td>
              <td>${m.socles||0}</td><td>${m.paniers||0}</td><td>${m.caisses||0}</td><td>${m.inox12||0}</td><td>${m.inox13||0}</td>
              <td style="white-space:nowrap;">
                <button class="btn btn-secondary btn-sm" data-edit-movement="${m.id}">✏️</button>
                <button class="btn btn-secondary btn-sm" data-delete-movement="${m.id}" style="color:var(--danger);">🗑️</button>
              </td>
            </tr>
          `;
          }).join("") || `<tr><td colspan="10" class="empty">Aucun mouvement</td></tr>`}
        </tbody>
      </table>
      </div>
    </div>
  `;
}

function escapeHtml(str) {
  return String(str||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function bindEvents() {
  document.querySelectorAll("[data-tab]").forEach(btn => {
    btn.onclick = () => { state.view = btn.dataset.tab; render(); };
  });
  document.querySelectorAll("[data-rtab]").forEach(btn => {
    btn.onclick = () => { state.respTab = btn.dataset.rtab; state.detailSchoolId = null; render(); };
  });

  const driverSelect = document.getElementById("driverSelect");
  if (driverSelect) driverSelect.onchange = (e) => { state.driverId = e.target.value; render(); };

  const startAddDriver = document.getElementById("startAddDriver");
  if (startAddDriver) startAddDriver.onclick = () => { state.addingDriver = true; state.newDriverName = ""; render(); };
  const cancelAddDriver = document.getElementById("cancelAddDriver");
  if (cancelAddDriver) cancelAddDriver.onclick = () => { state.addingDriver = false; render(); };
  const confirmAddDriver = document.getElementById("confirmAddDriver");
  if (confirmAddDriver) confirmAddDriver.onclick = () => {
    const val = document.getElementById("newDriverInput").value;
    addDriver(val);
  };
  const newDriverInput = document.getElementById("newDriverInput");
  if (newDriverInput) newDriverInput.oninput = (e) => { state.newDriverName = e.target.value; };

  const schoolSelect = document.getElementById("schoolSelect");
  if (schoolSelect) schoolSelect.onchange = (e) => { state.schoolId = e.target.value; render(); };

  document.querySelectorAll("[data-type]").forEach(btn => {
    btn.onclick = () => { state.type = btn.dataset.type; render(); };
  });

  document.querySelectorAll("[data-qty]").forEach(inp => {
    inp.oninput = (e) => { state.qty[inp.dataset.qty] = e.target.value; };
  });

  const submitBtn = document.getElementById("submitBtn");
  if (submitBtn) submitBtn.onclick = submitMovement;

  document.querySelectorAll("[data-school-detail]").forEach(row => {
    row.onclick = () => { state.detailSchoolId = row.dataset.schoolDetail; render(); };
  });
  const backBtn = document.getElementById("backToDashboard");
  if (backBtn) backBtn.onclick = () => { state.detailSchoolId = null; render(); };

  const startAddSchool = document.getElementById("startAddSchool");
  if (startAddSchool) startAddSchool.onclick = () => { state.addingSchool = true; render(); };
  const cancelAddSchool = document.getElementById("cancelAddSchool");
  if (cancelAddSchool) cancelAddSchool.onclick = () => { state.addingSchool = false; render(); };
  const confirmAddSchool = document.getElementById("confirmAddSchool");
  if (confirmAddSchool) confirmAddSchool.onclick = addSchool;
  ["newSchoolName","newSchoolChauffeur","newSchoolAdresse"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.oninput = (e) => {
      const key = id.replace("newSchool","").toLowerCase();
      state.newSchool[key] = e.target.value;
    };
  });

  const filterDriver = document.getElementById("filterDriver");
  if (filterDriver) filterDriver.onchange = (e) => { state.filters.driverId = e.target.value; render(); };
  const filterSchool = document.getElementById("filterSchool");
  if (filterSchool) filterSchool.onchange = (e) => { state.filters.schoolId = e.target.value; render(); };
  const filterType = document.getElementById("filterType");
  if (filterType) filterType.onchange = (e) => { state.filters.type = e.target.value; render(); };
  const exportBtn = document.getElementById("exportExcelBtn");
  if (exportBtn) exportBtn.onclick = exportExcel;

  // --- Édition mouvements ---
  document.querySelectorAll("[data-edit-movement]").forEach(btn => {
    btn.onclick = () => startEditMovement(btn.dataset.editMovement);
  });
  document.querySelectorAll("[data-delete-movement]").forEach(btn => {
    btn.onclick = () => askConfirm("Supprimer définitivement ce mouvement ?", () => deleteMovement(btn.dataset.deleteMovement));
  });
  const cancelEditMov = document.getElementById("cancelEditMovement");
  if (cancelEditMov) cancelEditMov.onclick = cancelEditMovement;
  const saveEditMov = document.getElementById("saveEditMovement");
  if (saveEditMov) saveEditMov.onclick = saveEditMovement;
  ["editMovDate","editMovType","editMovDriver","editMovSchool"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.onchange = el.oninput = (e) => {
      if (!state.editMovement) return;
      if (id === "editMovDate") state.editMovement.date = e.target.value;
      if (id === "editMovType") state.editMovement.type = e.target.value;
      if (id === "editMovDriver") state.editMovement.driverId = e.target.value;
      if (id === "editMovSchool") state.editMovement.schoolId = e.target.value;
    };
  });
  MATERIELS.forEach(mt => {
    const el = document.getElementById("editMovQty_" + mt.key);
    if (el) el.oninput = (e) => { if (state.editMovement) state.editMovement[mt.key] = e.target.value; };
  });

  // --- Édition écoles ---
  document.querySelectorAll("[data-edit-school]").forEach(btn => {
    btn.onclick = () => startEditSchool(btn.dataset.editSchool);
  });
  document.querySelectorAll("[data-delete-school]").forEach(btn => {
    btn.onclick = () => askConfirm("Supprimer cette école ? Son historique de mouvements sera conservé mais ne sera plus rattaché à une école active.", () => deleteSchool(btn.dataset.deleteSchool));
  });
  const cancelEditSch = document.getElementById("cancelEditSchool");
  if (cancelEditSch) cancelEditSch.onclick = cancelEditSchool;
  const saveEditSch = document.getElementById("saveEditSchool");
  if (saveEditSch) saveEditSch.onclick = saveEditSchool;
  ["editSchoolName","editSchoolChauffeur","editSchoolAdresse"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.oninput = (e) => {
      if (!state.editSchool) return;
      const key = id.replace("editSchool","").toLowerCase();
      state.editSchool[key] = e.target.value;
    };
  });

  // --- Édition chauffeurs ---
  document.querySelectorAll("[data-edit-driver]").forEach(btn => {
    btn.onclick = () => startEditDriver(btn.dataset.editDriver);
  });
  document.querySelectorAll("[data-delete-driver]").forEach(btn => {
    btn.onclick = () => askConfirm("Supprimer ce chauffeur ? Son historique de mouvements sera conservé.", () => deleteDriver(btn.dataset.deleteDriver));
  });
  const cancelEditDrv = document.getElementById("cancelEditDriver");
  if (cancelEditDrv) cancelEditDrv.onclick = cancelEditDriver;
  const saveEditDrv = document.getElementById("saveEditDriver");
  if (saveEditDrv) saveEditDrv.onclick = saveEditDriver;
  const editDriverNameInput = document.getElementById("editDriverName");
  if (editDriverNameInput) editDriverNameInput.oninput = (e) => { state.editDriverName = e.target.value; };

  // --- Modale de confirmation ---
  const confirmCancelBtn = document.getElementById("confirmCancelBtn");
  if (confirmCancelBtn) confirmCancelBtn.onclick = () => { state.confirmAction = null; render(); };
  const confirmOkBtn = document.getElementById("confirmOkBtn");
  if (confirmOkBtn) confirmOkBtn.onclick = () => {
    const action = state.confirmAction;
    state.confirmAction = null;
    if (action && action.onConfirmFn) action.onConfirmFn();
    render();
  };
}

initDb();
</script>
</body>
</html>
